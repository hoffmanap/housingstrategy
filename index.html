<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Paso Housing Strategy Simulator</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6; 
            --primary-hover: #2563eb;
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }
        #sidebar { 
            width: 350px; 
            background: var(--surface); 
            border-right: 1px solid var(--border); 
            padding: 20px; 
            overflow-y: auto; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.05); 
            z-index: 1000; 
        }
        #map { 
            flex-grow: 1; 
            height: 100vh; 
        }
        .control-group { margin-bottom: 20px; position: relative; }
        label { 
            display: flex; 
            align-items: center; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: var(--text-main); 
            font-size: 14px; 
        }
        select, input[type="range"] { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 14px; 
            box-sizing: border-box;
        }
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            width: 100%; 
            border-radius: 6px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s; 
            margin-bottom: 20px;
        }
        button:hover { background: var(--primary-hover); }
        
        /* Tooltip Styles */
        .info-icon { 
            display: inline-block; 
            width: 16px; 
            height: 16px; 
            background: var(--text-muted); 
            color: white; 
            border-radius: 50%; 
            text-align: center; 
            font-size: 12px; 
            line-height: 16px; 
            cursor: help; 
            margin-left: 8px; 
        }
        .tooltip { 
            display: none; 
            position: absolute; 
            top: 25px; 
            left: 0;
            background: #334155; 
            color: white; 
            padding: 8px 12px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 400;
            max-width: 250px; 
            z-index: 2000; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .info-icon:hover + .tooltip { display: block; }
        
        #dashboard { 
            padding: 15px; 
            background: var(--bg-color); 
            border: 1px solid var(--border); 
            border-radius: 6px; 
        }
        #dashboard h3 { margin-top: 0; font-size: 16px; color: var(--text-main); margin-bottom: 15px;}
        .stat-box { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 10px; 
            padding-bottom: 10px; 
            border-bottom: 1px solid var(--border); 
            font-size: 14px;
        }
        .stat-box:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .stat-value { font-weight: 700; color: var(--primary); font-size: 16px;}
        
        /* Loading Overlay */
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            flex-direction: column;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div id="loading-text">Loading Map Data (This may take a moment for all 8 Districts)...</div>
    </div>

    <div id="sidebar">
        <h2>Housing Strategy</h2>

        <div class="control-group">
            <label>Representative District</label>
            <select id="districtFilter" onchange="runSimulation()">
                <option value="all">Citywide (All Districts)</option>
                <option value="1">District 1</option>
                <option value="2">District 2</option>
                <option value="3">District 3</option>
                <option value="4">District 4</option>
                <option value="5">District 5</option>
                <option value="6">District 6</option>
                <option value="7">District 7</option>
                <option value="8">District 8</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Zoning Intervention 
                <span class="info-icon">i</span>
                <div class="tooltip">Select the proposed zoning policy to apply across eligible city parcels.</div>
            </label>
            <select id="scenario" onchange="runSimulation()">
                <option value="none">No Intervention</option>
                <option value="residential_conversions">Residential Conversions</option>
                <option value="commercial_midrise">Commercial Midrise (5-Story)</option>
                <option value="transit_oriented">Transit-Oriented Development</option>
            </select>
        </div>

        <div class="control-group">
            <label>Market Absorption Rate (%) 
                <span class="info-icon">i</span>
                <div class="tooltip">The probability (5-25%) that a landowner will realistically develop their property over the planning horizon.</div>
            </label>
            <input type="range" id="absorption" min="5" max="25" value="10" step="1" onchange="runSimulation()">
            <div style="text-align: right; font-size: 14px; font-weight: 600; margin-top: 5px;" id="absorption-val">10%</div>
        </div>

        <div class="control-group">
            <label>Enforce Deed Restrictions 
                <span class="info-icon">i</span>
                <div class="tooltip">Toggle on to respect active HOAs/covenants that prohibit multi-family homes or restrict density, overriding zoning.</div>
            </label>
            <select id="applyDeedRestrictions" onchange="runSimulation()">
                <option value="false">No</option>
                <option value="true">Yes</option>
            </select>
        </div>

        <button onclick="runSimulation()">Run Simulation</button>

        <div id="dashboard">
            <h3>Estimated Impact</h3>
            <div class="stat-box">
                <span>Net-New Housing Units:</span>
                <span id="total-units" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span>Net-New Jobs:</span>
                <span id="total-jobs" class="stat-value">0</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // Real-time UI Slider update
        document.getElementById('absorption').addEventListener('input', function(e) {
            document.getElementById('absorption-val').innerText = e.target.value + '%';
        });

        // Initialize Map
        const map = L.map('map').setView([31.7619, -106.4850], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let geojsonLayer = null;
        let historicPolygons = [];
        let deedRestrictionPolygons = [];
        let transitPolygons = [];
        let rawData = { type: "FeatureCollection", features: [] };
        
        // Define base path to data folder
        const DATA_PATH = './data/';

        // Bulletproof JSON Fetcher for helper files
        async function fetchGeoJSON(url) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.features) return data.features;
                }
            } catch(e) {
                console.warn(`File missing or invalid geometry inside ${url}`);
            }
            return [];
        }

        async function loadData() {
            try {
                // 1. Fetch supplementary spatial data gracefully
                historicPolygons = await fetchGeoJSON(DATA_PATH + 'historic.geojson');
                deedRestrictionPolygons = await fetchGeoJSON(DATA_PATH + 'deed_restrictions.geojson');
                transitPolygons = await fetchGeoJSON(DATA_PATH + 'transit_corridors.geojson');

                // 2. Load Representative Districts Boundaries
                try {
                    const repRes = await fetch(DATA_PATH + 'RepresentativeDistricts.geojson');
                    if (repRes.ok) {
                        const repData = await repRes.json();
                        L.geoJSON(repData, {
                            style: { color: '#0f172a', weight: 2, fillOpacity: 0, interactive: false, dashArray: '5, 5' }
                        }).addTo(map);
                    }
                } catch(e) { console.warn("Representative districts boundary map missing."); }

                // 3. Load all 8 Parcel Districts AND all 8 Footprint files
                for (let i = 1; i <= 8; i++) {
                    // A. Fetch Parcels
                    try {
                        const parcelRes = await fetch(`${DATA_PATH}Ready_Parcels_D${i}.geojson`);
                        if (parcelRes.ok) {
                            const parcelData = await parcelRes.json();
                            // Tag every parcel with its source district so we can filter later
                            parcelData.features.forEach(f => {
                                if (!f.properties) f.properties = {};
                                f.properties._district = String(i);
                            });
                            rawData.features.push(...parcelData.features);
                        }
                    } catch(e) { console.warn(`Ready_Parcels_D${i}.geojson failed to load.`); }

                    // B. Fetch Footprints (Optional mapping overlay)
                    try {
                        const fpRes = await fetch(`${DATA_PATH}footprints_d${i}.geojson`);
                        if (fpRes.ok) {
                            const fpData = await fpRes.json();
                            L.geoJSON(fpData, {
                                style: { fillColor: '#94a3b8', color: '#64748b', weight: 0.5, fillOpacity: 0.5, interactive: false }
                            }).addTo(map);
                        }
                    } catch(e) { console.warn(`footprints_d${i}.geojson failed to load.`); }
                }

                if (rawData.features.length === 0) {
                    throw new Error("No parcel data was found in the /data/ folder.");
                }
                
                // 4. Pre-process stitched parcels with Turf.js safely
                rawData.features.forEach(feature => {
                    const p = feature.properties;
                    p.property_tag = String(p.property_tag || "");
                    p.zoning = String(p.zoning || "");
                    p.transit_corridor = String(p.transit_corridor || "");
                    p.in_historic = String(p.in_historic || "");

                    let pt;
                    try { pt = turf.centerOfMass(feature); } catch(e) {
                        try { pt = turf.centroid(feature); } catch(err) {} 
                    }

                    p._inHistoric = (p.in_historic.toUpperCase() === 'Y' || p.in_historic.toUpperCase() === 'TRUE');
                    if (!p._inHistoric && pt) {
                        try {
                            p._inHistoric = historicPolygons.some(poly => {
                                if (!poly.geometry || !poly.geometry.type.includes('Polygon')) return false;
                                return turf.booleanPointInPolygon(pt, poly);
                            });
                        } catch(e) {}
                    }

                    p._inTransit = (p.transit_corridor.toUpperCase() === 'Y' || p.transit_corridor.toUpperCase() === 'TRUE');
                    if (!p._inTransit && pt) {
                        try {
                            p._inTransit = transitPolygons.some(poly => {
                                if (!poly.geometry || !poly.geometry.type.includes('Polygon')) return false;
                                return turf.booleanPointInPolygon(pt, poly);
                            });
                        } catch(e) {}
                    }
                    
                    p._hasDeedRestriction = false;
                    p._deedProps = {};
                    if (pt) {
                        try {
                            for (let poly of deedRestrictionPolygons) {
                                if (!poly.geometry || !poly.geometry.type.includes('Polygon')) continue;
                                if (turf.booleanPointInPolygon(pt, poly)) {
                                    p._hasDeedRestriction = true;
                                    p._deedProps = poly.properties || {};
                                    break;
                                }
                            }
                        } catch(e) {}
                    }
                });

                // 5. Initial Rendering of stitched parcel layer
                geojsonLayer = L.geoJSON(rawData, {
                    style: function() {
                        return { fillColor: '#cbd5e1', fillOpacity: 0.15, stroke: true, color: '#94a3b8', weight: 0.5, opacity: 0.3 };
                    }
                }).addTo(map);

                document.getElementById('loading-overlay').style.display = 'none';

                // Run the simulation immediately so data populates
                runSimulation();

            } catch (error) {
                console.error("Critical error loading data:", error);
                document.getElementById('loading-overlay').innerHTML = `
                    <div style="text-align:center; max-width: 600px; padding: 20px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                        <h2 style="color: #ef4444; margin-top: 0;">Data Missing in /data/ Folder</h2>
                        <p style="color: #334155; font-size: 16px;">The simulator checked the <code>/data/</code> folder but could not find the required files.</p>
                        <div style="background: #f8fafc; padding: 15px; border-radius: 6px; text-align: left; margin: 20px 0; border: 1px solid #e2e8f0;">
                            <strong style="color: #0f172a;">How to fix this:</strong>
                            <ol style="color: #334155; margin-bottom: 0; line-height: 1.6;">
                                <li>Ensure your GitHub repository has a folder named <code>data</code> at the exact same level as <code>index.html</code>.</li>
                                <li>Ensure the parcel files are exactly named <code>Ready_Parcels_D1.geojson</code> through <code>Ready_Parcels_D8.geojson</code>.</li>
                                <li>Make sure you have committed and pushed the files to GitHub.</li>
                            </ol>
                        </div>
                    </div>
                `;
            }
        }

        function runSimulation() {
            if (!geojsonLayer) return;

            const currentScenario = document.getElementById('scenario').value;
            const absorptionRate = parseFloat(document.getElementById('absorption').value) / 100;
            const applyDeedRestrictions = document.getElementById('applyDeedRestrictions').value === 'true';
            const targetDistrict = document.getElementById('districtFilter').value;

            let totalNetUnits = 0;
            let totalNetJobs = 0;

            geojsonLayer.eachLayer(function(layer) {
                const props = layer.feature.properties;
                
                props._calcUnits = 0;
                props._calcJobs = 0;
                props._isVisible = true;

                // --- DISTRICT FILTER ---
                if (targetDistrict !== 'all' && props._district !== targetDistrict) {
                    props._isVisible = false;
                    layer.setStyle({ opacity: 0, fillOpacity: 0 });
                    return; // Skip calculation for hidden districts
                }

                // --- HARD CONSTRAINT: Historic Districts ---
                if (props._inHistoric) {
                    props._isVisible = false;
                    layer.setStyle({ opacity: 0, fillOpacity: 0 }); 
                    return; 
                }

                try {
                    const existingUnits = parseInt(props.existing_units, 10) || 0;
                    const lotSqft = parseFloat(props.lot_sqft) || 1; 
                    const bldgSqft = parseFloat(props.building_sqft) || 0;

                    let grossNewUnits = 0;
                    let grossNewJobs = 0;

                    const isVacant = ["A7", "A8", "C1", "C10"].includes(props.property_tag.toUpperCase());
                    const bldgRatio = bldgSqft / lotSqft;
                    const meetsUnderutilized = isVacant || (bldgRatio < 0.15);

                    if (currentScenario === 'commercial_midrise' && meetsUnderutilized) {
                        const footprint = lotSqft * 0.5;
                        grossNewUnits = Math.floor((footprint * 4) / 850);
                        grossNewJobs = Math.floor(footprint / 300);
                        
                    } else if (currentScenario === 'residential_conversions' && meetsUnderutilized) {
                        if (lotSqft > 6000) {
                            grossNewUnits = 16;
                        } else if (lotSqft > 5000) {
                            grossNewUnits = 8;
                        }

                    } else if (currentScenario === 'transit_oriented' && meetsUnderutilized && props._inTransit) {
                        grossNewUnits = Math.floor((lotSqft / 43560) * 65); 
                        grossNewJobs = Math.floor(lotSqft / 500); 
                    }

                    let likelyUnits = Math.round(grossNewUnits * absorptionRate);
                    let likelyJobs = Math.round(grossNewJobs * absorptionRate);

                    props._calcUnits = Math.max(0, likelyUnits - existingUnits);
                    props._calcJobs = likelyJobs;

                    if (applyDeedRestrictions && props._hasDeedRestriction && currentScenario !== 'none') {
                        const covProps = props._deedProps;
                        const allowMf = String(covProps.allowMf || 'TRUE').toUpperCase();
                        const sfOnly = String(covProps.sfOnly || 'FALSE').toUpperCase();

                        if (allowMf === 'FALSE' || allowMf === '0' || allowMf === 'N' || sfOnly === 'Y' || sfOnly === 'YES' || sfOnly === 'TRUE') {
                            props._calcUnits = 0; 
                        }

                        if (covProps.max_units !== null && covProps.max_units !== undefined && String(covProps.max_units).trim() !== '') {
                            let maxCap = parseInt(covProps.max_units, 10);
                            if (!isNaN(maxCap) && props._calcUnits > maxCap) {
                                props._calcUnits = maxCap;
                            }
                        }
                    }

                    totalNetUnits += props._calcUnits;
                    totalNetJobs += props._calcJobs;

                } catch(err) { }

                // --- RENDERING LOGIC ---
                try {
                    const u = props._calcUnits;
                    const j = props._calcJobs;
                    
                    if (u === 0 && j === 0) {
                        layer.setStyle({
                            fillColor: '#cbd5e1', fillOpacity: 0.15, stroke: true, color: '#94a3b8', opacity: 0.3, weight: 0.5 
                        });
                    } else {
                        layer.setStyle({ 
                            fillColor: (j > u) ? "#f59e0b" : (u > j ? "#3b82f6" : "#cbd5e1"), 
                            fillOpacity: 0.65, 
                            stroke: true, 
                            color: (j > u) ? "#d97706" : (u > j ? "#2563eb" : "#94a3b8"),
                            opacity: 0.8, 
                            weight: 0.5 
                        });
                    }
                } catch (err) {}
            }); 

            document.getElementById('total-units').innerText = totalNetUnits.toLocaleString();
            document.getElementById('total-jobs').innerText = totalNetJobs.toLocaleString();
        }

        window.onload = loadData;
    </script>
</body>
</html>
