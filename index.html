<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>El Paso Housing Strategy Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <aside class="w-96 bg-white border-r shadow-lg overflow-y-auto p-6 z-10">
        <h1 class="text-xl font-bold mb-6 text-blue-900">Policy Levers</h1>
        
        <div class="bg-gray-50 p-4 rounded-lg mb-6 space-y-2">
            <h2 class="font-bold text-xs uppercase text-gray-500">Geography Filters</h2>
            <label class="flex items-center gap-2"><input type="checkbox" id="ctx_urban" checked> Urban</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="ctx_suburban" checked> Suburban</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="transit_corridors_only"> Transit Corridors Only</label>
        </div>

        <div class="space-y-4">
            <label class="flex items-center gap-2"><input type="checkbox" id="eliminate_parking" checked> Eliminate Parking Min</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="allow_adus" checked> Allow ADUs</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="allow_splits" checked> Allow Lot Splits</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="allow_townhomes" checked> Allow Townhomes</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="allow_conversions" checked> Allow Interior Conversions</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="allow_middle" checked> Allow Middle Housing</label>
            
            <div class="pt-2">
                <label class="block text-sm">Middle Housing Tier:</label>
                <select id="middle_tier" class="w-full border p-2 rounded">
                    <option value="5-8">5-8 Units</option>
                    <option value="9-16" selected>9-16 Units</option>
                </select>
            </div>

            <label class="flex items-center gap-2"><input type="checkbox" id="allow_midrise" checked> Allow Midrise (Corridors)</label>
            
            <div class="pt-2">
                <label class="block text-sm">Max Midrise Stories:</label>
                <input type="number" id="midrise_stories" value="5" class="w-full border p-2 rounded">
            </div>

            <button onclick="runSimulation()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Run Simulation</button>
        </div>
    </aside>

    <main class="flex-1">
        <div id="map" class="h-full"></div>
    </main>

    <script>
        const map = L.map('map').setView([31.76, -106.48], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        let allParcels = [];
        let geojsonLayer;

        async function loadAllData() {
            for (let i = 1; i <= 8; i++) {
                try {
                    const res = await fetch(`./data/Ready_Parcels_D${i}.geojson`);
                    if (res.ok) {
                        const data = await res.json();
                        allParcels.push(...data.features);
                    }
                } catch (e) { console.warn(`District ${i} missing`); }
            }
            console.log("Debug: Sample Parcel Properties:", allParcels[0]?.properties);
        }

        function runSimulation() {
            // Get all levers
            const levers = {
                eliminate_parking: document.getElementById('eliminate_parking').checked,
                allow_adus: document.getElementById('allow_adus').checked,
                allow_splits: document.getElementById('allow_splits').checked,
                allow_townhomes: document.getElementById('allow_townhomes').checked,
                allow_conversions: document.getElementById('allow_conversions').checked,
                allow_middle: document.getElementById('allow_middle').checked,
                middle_tier: document.getElementById('middle_tier').value,
                allow_midrise: document.getElementById('allow_midrise').checked,
                midrise_stories: parseInt(document.getElementById('midrise_stories').value)
            };

            const transitOnly = document.getElementById('transit_corridors_only').checked;
            const ctxUrban = document.getElementById('ctx_urban').checked;
            const ctxSuburban = document.getElementById('ctx_suburban').checked;

            let filtered = allParcels.filter(p => {
                const props = p.properties;
                
                // 1. Geographic Filters
                if (transitOnly && !props.in_corridor) return false;
                
                // Debugging the context filter: 
                // We assume your data has 'in_context' or similar. 
                // Replace 'in_context' with the actual column name found in the console log.
                if (props.in_context) { 
                    if (!ctxUrban && props.context_type === 'Urban') return false;
                    if (!ctxSuburban && props.context_type === 'Suburban') return false;
                }
                
                return true;
            });

            console.log(`Simulation complete. ${filtered.length} parcels processed.`);
            // [Rendering logic here...]
        }

        window.onload = loadAllData;
    </script>
</body>
</html>
