<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Paso Housing Strategy Simulator</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6; /* Modern Blue */
            --primary-hover: #2563eb;
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: var(--bg-color); color: var(--text-main); }
        
        #sidebar { 
            width: 350px; 
            background: var(--surface); 
            border-right: 1px solid var(--border); 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.05); 
            z-index: 1000; 
        }
        
        #map { flex-grow: 1; z-index: 1; }
        
        h2 { margin-top: 0; font-size: 20px; font-weight: 700; color: var(--text-main); }
        
        .toggle-container { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px; 
            background: var(--bg-color); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
        }
        
        .toggle-container label { display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; font-size: 14px;}
        .tooltip { cursor: help; font-size: 16px; }
        
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 15px;
            cursor: pointer; 
            width: 100%; 
            transition: 0.2s; 
        }
        
        button:hover { background: var(--primary-hover); }
        
        .dashboard { margin-top: 10px; padding: 15px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border); }
        .dashboard h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .banner { 
            margin-bottom: 10px; 
            padding: 12px; 
            border-radius: 6px; 
            background: white; 
            border: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 14px; 
            font-weight: 600; 
        }
        
        select { 
            width: 100%; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid var(--border); 
            font-family: inherit; 
            font-size: 14px; 
            margin-top: 8px; 
        }

        .target-remaining { padding: 4px 8px; border-radius: 4px; color: white; font-size: 12px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>El Paso Housing Strategy</h2>
        
        <div>
            <label style="font-weight: 600; font-size: 14px;">Select Zoning Intervention:</label>
            <select id="scenarioSelect">
                <option value="none">Baseline (No Intervention)</option>
                <option value="residential_conversions">Residential Conversions</option>
                <option value="commercial_midrise">Commercial Midrise</option>
            </select>
        </div>

        <div class="toggle-container">
            <label>
                <input type="checkbox" id="historicToggle"> 
                Protect Historic Districts
            </label>
            <span class="tooltip" title="Prevents development inside historic areas.">ℹ️</span>
        </div>

        <div class="toggle-container">
            <label>
                <input type="checkbox" id="covenantToggle"> 
                Enforce Covenants & Deed Restrictions
            </label>
            <span class="tooltip" title="When active, prevents simulated capacity on parcels where covenants prohibit commercial, multifamily, or cap units.">ℹ️</span>
        </div>

        <button onclick="runSimulation()">Run Simulation</button>

        <div class="dashboard">
            <h3>Dashboard Totals</h3>
            <div id="units-banner-status" class="banner">
                <span class="target-title">Units Target</span>
                <span class="target-value">0</span>
                <span class="target-remaining" style="background: var(--border); color: var(--text-muted);">Awaiting Run</span>
            </div>
            <div id="jobs-banner-status" class="banner">
                <span class="target-title">Jobs Target</span>
                <span class="target-value">0</span>
                <span class="target-remaining" style="background: var(--border); color: var(--text-muted);">Awaiting Run</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // --- Initialize Map ---
        let map = L.map('map').setView([31.7619, -106.4850], 12); 
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // --- Global Variables ---
        let parcelData = null;
        let historicData = null;
        let covenantsData = null; 
        
        let geojsonLayer = L.geoJSON(null, {
            style: function (feature) {
                return {
                    fillColor: "#cbd5e1",
                    fillOpacity: 0.15,
                    color: "#94a3b8",
                    weight: 1,
                    opacity: 0.3
                };
            }
        }).addTo(map);

        // --- Data Loading ---
        
        // 1. Load Parcels
        fetch('parcels.geojson') 
            .then(response => response.json())
            .then(data => {
                parcelData = data;
                geojsonLayer.addData(data);
                console.log("Parcels loaded successfully.");
            })
            .catch(error => console.error("Error loading parcels:", error));

        // 2. Load Historic Boundaries
        fetch('historic.geojson')
            .then(response => response.json())
            .then(data => {
                historicData = data;
                console.log("Historic data loaded successfully.");
            })
            .catch(error => console.error("Error loading historic boundaries:", error));

        // 3. Load Covenants (NEW FETCH BLOCK)
        fetch('covenants.geojson')
            .then(response => response.json())
            .then(data => {
                covenantsData = data;
                console.log("Covenants loaded successfully.");
            })
            .catch(error => console.error("Error loading covenants:", error));

        // --- Simulation Engine ---
        function runSimulation() {
            if (!parcelData) {
                alert("Please wait for all data to load.");
                return;
            }

            const currentScenario = document.getElementById('scenarioSelect').value;
            const applyHistoric = document.getElementById('historicToggle').checked;
            const applyCovenants = document.getElementById('covenantToggle').checked;

            let totalUnits = 0;
            let totalJobs = 0;

            parcelData.features.forEach(feature => {
                let props = feature.properties;
                let simulatedUnits = 0;
                let simulatedJobs = 0;

                // Ensure parcelPoint is defined for Turf.js calculations
                let parcelPoint = turf.centroid(feature);

                // --- 1. HISTORIC DISTRICT CHECK ---
                let inHistoric = false;
                if (applyHistoric && historicData) {
                    for (let histFeature of historicData.features) {
                        if (turf.booleanPointInPolygon(parcelPoint, histFeature)) {
                            inHistoric = true;
                            break; 
                        }
                    }
                }

                // --- 2. APPLY SCENARIO MATH (If not protected) ---
                if (!inHistoric) {
                    // Extracting pre-calculated capacity from calculate.py outputs
                    let existingUnits = props.existing_units || 0;
                    
                    if (currentScenario === 'residential_conversions') {
                        simulatedUnits = (props.sim_res_conv_units || 0) - existingUnits;
                        simulatedJobs = props.sim_res_conv_jobs || 0;
                    } 
                    else if (currentScenario === 'commercial_midrise') {
                        simulatedUnits = (props.sim_midrise_units || 0) - existingUnits;
                        simulatedJobs = props.sim_midrise_jobs || 0;
                    }

                    // Prevent negative yields
                    if (simulatedUnits < 0) simulatedUnits = 0;
                    if (simulatedJobs < 0) simulatedJobs = 0;

                    // --- 3. APPLY COVENANTS & DEED RESTRICTIONS (NEW LOGIC) ---
                    if (applyCovenants && covenantsData) {
                        for (let covFeature of covenantsData.features) {
                            if (turf.booleanPointInPolygon(parcelPoint, covFeature)) {
                                let covProps = covFeature.properties;

                                // Rule 1: Commercial Restrictions
                                if (currentScenario === 'commercial_midrise') {
                                    if (covProps.allow_com === false || covProps['SINGLE FAMILY ONLY'] === 'Y') {
                                        simulatedJobs = 0; 
                                    }
                                }
                                
                                // Rule 2: Multi-Family Restrictions
                                if (currentScenario === 'residential_conversions' || currentScenario === 'commercial_midrise') {
                                    if (covProps.allow_mf === false || covProps['SINGLE FAMILY ONLY'] === 'Y') {
                                        simulatedUnits = 0; 
                                    }
                                }

                                // Rule 3: Hard Cap on Units
                                if (covProps.max_units !== null && covProps.max_units !== undefined && covProps.max_units !== "") {
                                    let maxCap = parseInt(covProps.max_units, 10);
                                    if (simulatedUnits > maxCap) {
                                        simulatedUnits = maxCap;
                                    }
                                }
                                
                                // Break out of loop once we find the covenant intersecting this parcel
                                break; 
                            }
                        }
                    }
                    // --- END COVENANTS LOGIC ---
                }

                // Store final values back in properties for map rendering
                props._calcUnits = simulatedUnits;
                props._calcJobs = simulatedJobs;
                props._isVisible = (simulatedUnits > 0 || simulatedJobs > 0);

                totalUnits += simulatedUnits;
                totalJobs += simulatedJobs;
            });

            // --- Update Map Styling ---
            geojsonLayer.eachLayer(layer => {
                const props = layer.feature.properties;
                
                if (!props._isVisible) { 
                    layer.setStyle({ opacity: 0, fillOpacity: 0 }); 
                    return; 
                }
                
                const u = props._calcUnits || 0;
                const j = props._calcJobs || 0;
                
                // Color logic: Orange if Jobs > Units, Blue if Units > Jobs
                layer.setStyle({ 
                    fillColor: (j > u) ? "#f59e0b" : (u > j ? "#3b82f6" : "#cbd5e1"), 
                    fillOpacity: (u+j > 0) ? 0.65 : 0.15, 
                    stroke: true, 
                    color: (j > u) ? "#d97706" : (u > j ? "#2563eb" : "#94a3b8"),
                    opacity: (u+j > 0) ? 0.8 : 0.3, 
                    weight: 1
                });
            });

            // --- Update Dashboard Banner ---
            const targetUnits = 20000; // Adjust to your actual El Paso goals
            const targetJobs = 15000;  
            
            let remainingUnits = targetUnits - totalUnits;
            let remainingJobs = targetJobs - totalJobs;
            
            let unitColor = remainingUnits > 0 ? '#3b82f6' : '#10b981';
            let unitBg = remainingUnits > 0 ? '#eff6ff' : '#ecfdf5';
            
            let jobColor = remainingJobs > 0 ? '#f59e0b' : '#10b981';
            let jobBg = remainingJobs > 0 ? '#fffbeb' : '#ecfdf5';

            document.getElementById('units-banner-status').innerHTML = `
                <span class="target-title">Units Target</span>
                <span class="target-value">${totalUnits.toLocaleString()}</span>
                <span class="target-remaining" style="color: ${unitColor}; background: ${unitBg}">
                    ${remainingUnits > 0 ? 'Remaining: ' + remainingUnits.toLocaleString() : 'Target Met! 🎉'}
                </span>
            `;

            document.getElementById('jobs-banner-status').innerHTML = `
                <span class="target-title">Jobs Target</span>
                <span class="target-value">${totalJobs.toLocaleString()}</span>
                <span class="target-remaining" style="color: ${jobColor}; background: ${jobBg}">
                    ${remainingJobs > 0 ? 'Remaining: ' + remainingJobs.toLocaleString() : 'Target Met! 🎉'}
                </span>
            `;
        }
    </script>
</body>
</html>
