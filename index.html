<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Paso Housing Strategy Simulator</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6; 
            --primary-hover: #2563eb;
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }
        #sidebar { 
            width: 350px; 
            background: var(--surface); 
            border-right: 1px solid var(--border); 
            padding: 20px; 
            overflow-y: auto; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.05); 
            z-index: 1000; 
        }
        #map { 
            flex-grow: 1; 
            height: 100vh; 
        }
        .control-group { margin-bottom: 20px; position: relative; }
        label { 
            display: flex; 
            align-items: center; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: var(--text-main); 
            font-size: 14px; 
        }
        select, input[type="range"] { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 14px; 
            box-sizing: border-box;
        }
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            width: 100%; 
            border-radius: 6px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s; 
            margin-bottom: 20px;
        }
        button:hover { background: var(--primary-hover); }
        
        /* Tooltip Styles */
        .info-icon { 
            display: inline-block; 
            width: 16px; 
            height: 16px; 
            background: var(--text-muted); 
            color: white; 
            border-radius: 50%; 
            text-align: center; 
            font-size: 12px; 
            line-height: 16px; 
            cursor: help; 
            margin-left: 8px; 
        }
        .tooltip { 
            display: none; 
            position: absolute; 
            top: 25px; 
            left: 0;
            background: #334155; 
            color: white; 
            padding: 8px 12px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 400;
            max-width: 250px; 
            z-index: 2000; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .info-icon:hover + .tooltip { display: block; }
        
        #dashboard { 
            padding: 15px; 
            background: var(--bg-color); 
            border: 1px solid var(--border); 
            border-radius: 6px; 
        }
        #dashboard h3 { margin-top: 0; font-size: 16px; color: var(--text-main); margin-bottom: 15px;}
        .stat-box { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 10px; 
            padding-bottom: 10px; 
            border-bottom: 1px solid var(--border); 
            font-size: 14px;
        }
        .stat-box:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .stat-value { font-weight: 700; color: var(--primary); font-size: 16px;}
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Housing Strategy</h2>
        
        <div class="control-group">
            <label>Zoning Intervention 
                <span class="info-icon">i</span>
                <div class="tooltip">Select the proposed zoning policy to apply across eligible city parcels.</div>
            </label>
            <select id="scenario">
                <option value="none">No Intervention</option>
                <option value="residential_conversions">Residential Conversions</option>
                <option value="commercial_midrise">Commercial Midrise (5-Story)</option>
                <option value="transit_oriented">Transit-Oriented Development</option>
            </select>
        </div>

        <div class="control-group">
            <label>Market Absorption Rate (%) 
                <span class="info-icon">i</span>
                <div class="tooltip">The probability (5-25%) that a landowner will realistically develop their property over the planning horizon.</div>
            </label>
            <input type="range" id="absorption" min="5" max="25" value="10" step="1">
            <div style="text-align: right; font-size: 14px; font-weight: 600; margin-top: 5px;" id="absorption-val">10%</div>
        </div>

        <div class="control-group">
            <label>Enforce Deed Restrictions 
                <span class="info-icon">i</span>
                <div class="tooltip">Toggle on to respect active HOAs/covenants that prohibit multi-family homes or restrict density, overriding zoning.</div>
            </label>
            <select id="applyDeedRestrictions">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
        </div>

        <button onclick="runSimulation()">Run Simulation</button>

        <div id="dashboard">
            <h3>Estimated Impact</h3>
            <div class="stat-box">
                <span>Net-New Housing Units:</span>
                <span id="total-units" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span>Net-New Jobs:</span>
                <span id="total-jobs" class="stat-value">0</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // UI Slider logic
        document.getElementById('absorption').addEventListener('input', function(e) {
            document.getElementById('absorption-val').innerText = e.target.value + '%';
        });

        // Initialize Map
        const map = L.map('map').setView([31.7619, -106.4850], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let geojsonLayer = null;
        let historicPolygons = [];
        let deedRestrictionPolygons = [];
        let transitPolygons = [];
        let rawData = null;

        async function loadData() {
            try {
                // 1. Fetch Constraints (Degrades gracefully if files are missing)
                try {
                    const histRes = await fetch('historic.geojson');
                    if (histRes.ok) historicPolygons = (await histRes.json()).features;
                } catch(e) { console.warn("Historic constraints missing."); }

                try {
                    const deedRes = await fetch('deed_restrictions.geojson');
                    if (deedRes.ok) deedRestrictionPolygons = (await deedRes.json()).features;
                } catch(e) { console.warn("Deed restrictions missing."); }

                try {
                    const transitRes = await fetch('transit_corridors.geojson');
                    if (transitRes.ok) transitPolygons = (await transitRes.json()).features;
                } catch(e) { console.warn("Transit corridors missing."); }

                // 2. Fetch Core Parcel Data
                const response = await fetch('parcels.geojson');
                rawData = await response.json();
                
                // 3. Pre-process parcels with Turf.js
                rawData.features.forEach(feature => {
                    if (!feature.properties) feature.properties = {};
                    
                    // Safety checks: ensure strings aren't null
                    const p = feature.properties;
                    p.zoning = p.zoning || "";
                    p.land_use = p.land_use || "";
                    p.property_tag = String(p.property_tag || "");

                    let pt;
                    try { pt = turf.centerOfMass(feature); } catch(e) {
                        try { pt = turf.centroid(feature); } catch(err) { return; }
                    }

                    // Spatial Intersections
                    p._inHistoric = historicPolygons.some(poly => turf.booleanPointInPolygon(pt, poly));
                    p._inTransit = transitPolygons.some(poly => turf.booleanPointInPolygon(pt, poly)) || String(p.transit_corridor).toUpperCase() === 'Y';
                    
                    p._hasDeedRestriction = false;
                    p._deedProps = {};
                    for (let poly of deedRestrictionPolygons) {
                        if (turf.booleanPointInPolygon(pt, poly)) {
                            p._hasDeedRestriction = true;
                            p._deedProps = poly.properties || {};
                            break;
                        }
                    }
                });

                // 4. Initial Render
                geojsonLayer = L.geoJSON(rawData, {
                    style: function() {
                        return { fillColor: '#cbd5e1', fillOpacity: 0.15, stroke: true, color: '#94a3b8', weight: 0.5, opacity: 0.3 };
                    }
                }).addTo(map);

            } catch (error) {
                console.error("Critical error loading data:", error);
            }
        }

        function runSimulation() {
            if (!geojsonLayer) return;

            const currentScenario = document.getElementById('scenario').value;
            const absorptionRate = parseFloat(document.getElementById('absorption').value) / 100;
            const applyDeedRestrictions = document.getElementById('applyDeedRestrictions').value === 'true';

            let totalNetUnits = 0;
            let totalNetJobs = 0;

            // This is the SINGLE eachLayer loop. No duplicated closures!
            geojsonLayer.eachLayer(function(layer) {
                const props = layer.feature.properties;
                
                // Reset calculations for this parcel
                props._calcUnits = 0;
                props._calcJobs = 0;
                props._isVisible = true;

                // --- CONSTRAINT 1: Historic Districts ---
                if (props._inHistoric) {
                    props._isVisible = false;
                    layer.setStyle({ opacity: 0, fillOpacity: 0 }); 
                    return; // Skip calculation and rendering
                }

                try {
                    // Force text to numbers to prevent calculation failures
                    const existingUnits = parseInt(props.existing_units, 10) || 0;
                    const lotSqft = parseFloat(props.lot_sqft) || 1; 
                    const bldgSqft = parseFloat(props.building_sqft) || 0;

                    let grossNewUnits = 0;
                    let grossNewJobs = 0;

                    // --- FILTER: Vacant or Underutilized ---
                    const isVacant = ["A7", "A8", "C1", "C10"].includes(props.property_tag.toUpperCase());
                    const bldgRatio = bldgSqft / lotSqft;
                    const meetsUnderutilized = isVacant || (bldgRatio < 0.15);

                    // --- SCENARIO LOGIC ---
                    if (currentScenario === 'commercial_midrise' && meetsUnderutilized) {
                        const footprint = lotSqft * 0.5;
                        grossNewUnits = Math.floor((footprint * 4) / 850);
                        grossNewJobs = Math.floor(footprint / 300);
                        
                    } else if (currentScenario === 'residential_conversions' && meetsUnderutilized) {
                        if (lotSqft > 6000) {
                            grossNewUnits = 16;
                        } else if (lotSqft > 5000) {
                            grossNewUnits = 8;
                        }

                    } else if (currentScenario === 'transit_oriented' && meetsUnderutilized && props._inTransit) {
                        // Transit Corridor specific density
                        grossNewUnits = Math.floor((lotSqft / 43560) * 65); // e.g., 65 units/acre 
                        grossNewJobs = Math.floor(lotSqft / 500); // Mixed use job estimate
                    }

                    // --- ABSORPTION & NET YIELD ---
                    let likelyUnits = Math.round(grossNewUnits * absorptionRate);
                    let likelyJobs = Math.round(grossNewJobs * absorptionRate);

                    props._calcUnits = Math.max(0, likelyUnits - existingUnits);
                    props._calcJobs = likelyJobs;

                    // --- CONSTRAINT 2: Deed Restrictions ---
                    if (applyDeedRestrictions && props._hasDeedRestriction && currentScenario !== 'none') {
                        const covProps = props._deedProps;
                        const allowMf = String(covProps.allowMf || 'TRUE').toUpperCase();
                        const sfOnly = String(covProps.sfOnly || 'FALSE').toUpperCase();

                        // Wipe units if multi-family is forbidden
                        if (allowMf === 'FALSE' || allowMf === '0' || allowMf === 'N' || sfOnly === 'Y' || sfOnly === 'YES' || sfOnly === 'TRUE') {
                            props._calcUnits = 0; 
                        }

                        // Cap units if a hard max is set
                        if (covProps.max_units) {
                            let maxCap = parseInt(covProps.max_units, 10);
                            if (!isNaN(maxCap) && props._calcUnits > maxCap) {
                                props._calcUnits = maxCap;
                            }
                        }
                    }

                    // Tally dashboard totals
                    totalNetUnits += props._calcUnits;
                    totalNetJobs += props._calcJobs;

                } catch(err) {
                    console.error("Calculation error:", err);
                }

                // --- RENDERING LOGIC ---
                try {
                    const u = props._calcUnits;
                    const j = props._calcJobs;
                    
                    if (u === 0 && j === 0) {
                        layer.setStyle({
                            fillColor: '#cbd5e1', fillOpacity: 0.15, stroke: true, color: '#94a3b8', opacity: 0.3, weight: 0.5 
                        });
                    } else {
                        layer.setStyle({ 
                            fillColor: (j > u) ? "#f59e0b" : (u > j ? "#3b82f6" : "#cbd5e1"), 
                            fillOpacity: 0.65, 
                            stroke: true, 
                            color: (j > u) ? "#d97706" : (u > j ? "#2563eb" : "#94a3b8"),
                            opacity: 0.8, 
                            weight: 0.5 
                        });
                    }
                } catch (err) {}
            }); // <-- This securely closes the entire loop

            // Update Dashboard UI
            document.getElementById('total-units').innerText = totalNetUnits.toLocaleString();
            document.getElementById('total-jobs').innerText = totalNetJobs.toLocaleString();
        }

        window.onload = loadData;
    </script>
</body>
</html>
