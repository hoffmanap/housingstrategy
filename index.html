<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Paso Housing Strategy Simulator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: 100%; width: 100%; min-height: 600px; border-radius: 0.5rem; z-index: 1;}
        .loading-overlay {
            display: none; position: absolute; inset: 0; background: rgba(255,255,255,0.8);
            z-index: 50; justify-content: center; align-items: center; flex-direction: column;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <aside class="w-96 bg-white border-r border-gray-200 overflow-y-auto flex flex-col shadow-lg z-10">
        <div class="p-6 bg-blue-900 text-white">
            <h1 class="text-2xl font-bold">Housing Simulator</h1>
            <p class="text-sm text-blue-200 mt-1">El Paso Strategic Plan Evaluator</p>
        </div>

        <div class="p-6 space-y-6 flex-grow">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Market Absorption Rate</label>
                <div class="flex items-center gap-4">
                    <input type="range" id="absorption" min="0" max="1" step="0.05" value="0.10" class="w-full" oninput="document.getElementById('absorp_val').innerText = Math.round(this.value * 100) + '%'">
                    <span id="absorp_val" class="font-mono bg-gray-100 px-2 py-1 rounded text-sm">10%</span>
                </div>
                <p class="text-xs text-gray-500 mt-1">Probability a viable parcel is actually developed.</p>
            </div>

            <hr>

            <div>
                <h3 class="font-bold text-gray-800 mb-2">Geographic Filters</h3>
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="exclude_historic" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm text-gray-700">Exclude Historic Districts</span>
                </label>
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="restrict_context" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm text-gray-700">Restrict to Growth Context Areas</span>
                </label>
            </div>

            <hr>

            <div>
                <h3 class="font-bold text-gray-800 mb-2">Residential Reforms</h3>
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="allow_adus" class="w-4 h-4 text-blue-600 rounded" checked>
                    <span class="text-sm text-gray-700">Allow ADUs on Single-Family</span>
                </label>
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="allow_middle" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm text-gray-700">Allow Missing Middle Housing</span>
                </label>
                <select id="middle_tier" class="mt-1 block w-full pl-3 pr-10 py-2 text-sm border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 rounded-md bg-gray-50">
                    <option value="4-plex">Up to 4-Plex</option>
                    <option value="8-plex">Up to 8-Plex</option>
                    <option value="16-plex">Up to 16-Plex</option>
                </select>
                <label class="flex items-center space-x-3 mt-3 mb-2">
                    <input type="checkbox" id="allow_splits" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm text-gray-700">Allow Lot Splits (Min 4000 sqft)</span>
                </label>
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="allow_conversions" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm text-gray-700">Allow Large Home Subdivisions</span>
                </label>
            </div>

            <hr>

            <div>
                <h3 class="font-bold text-gray-800 mb-2">Commercial & Corridor Reforms</h3>
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="allow_midrise" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm text-gray-700">Allow Midrise in Transit Corridors</span>
                </label>
                <label class="block text-sm text-gray-700 mb-1 mt-3">Redevelopment Focus</label>
                <select id="redev_mode" class="block w-full pl-3 pr-10 py-2 text-sm border-gray-300 rounded-md bg-gray-50">
                    <option value="Vertical Mixed-Use">Vertical Mixed-Use (Jobs + Housing)</option>
                    <option value="Pure Residential Infill">Pure Residential Infill</option>
                    <option value="Preserve Current Base Use">Preserve Base Use (Jobs only)</option>
                </select>
            </div>

            <hr>
            
            <div>
                <h3 class="font-bold text-gray-800 mb-2">Site Regulations</h3>
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="eliminate_parking" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm text-gray-700">Eliminate Parking Minimums</span>
                </label>
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="only_vacant" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm text-gray-700">Only target Vacant/Underutilized</span>
                </label>
            </div>

        </div>

        <div class="p-6 bg-gray-50 border-t">
            <button onclick="runSimulation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded shadow transition-colors">
                Run Simulation
            </button>
        </div>
    </aside>

    <main class="flex-1 relative flex flex-col bg-gray-200 p-4">
        
        <div class="absolute top-8 right-8 z-50 flex gap-4 pointer-events-none">
            <div class="bg-white/95 backdrop-blur shadow-lg rounded-xl p-6 pointer-events-auto border-l-4 border-blue-500">
                <p class="text-sm text-gray-500 font-bold uppercase tracking-wider">New Housing Units</p>
                <p id="stat-units" class="text-4xl font-black text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white/95 backdrop-blur shadow-lg rounded-xl p-6 pointer-events-auto border-l-4 border-green-500">
                <p class="text-sm text-gray-500 font-bold uppercase tracking-wider">New Jobs Added</p>
                <p id="stat-jobs" class="text-4xl font-black text-gray-800 mt-1">0</p>
            </div>
        </div>

        <div class="flex-1 relative shadow-inner bg-white rounded-lg overflow-hidden border border-gray-300">
            <div id="loading" class="loading-overlay flex">
                <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-lg font-bold text-gray-700" id="loading-text">Loading Map Data...</p>
            </div>
            <div id="map"></div>
        </div>

    </main>

    <script>
        // Constants
        const AVG_UNIT_SIZE = 850;
        const CONVERSION_UNIT_SIZE = 600;
        const SQ_FT_PER_EMPLOYEE = 300;

        // Map Setup
        const map = L.map('map').setView([31.76, -106.48], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        let geojsonLayer;
        let allParcelsData = null;

        // A stable Pseudo-Random Number Generator so maps don't flicker randomly per click
        function seededRandom(seedStr) {
            let h = 0xdeadbeef;
            for(let i = 0; i < seedStr.length; i++) h = Math.imul(h ^ seedStr.charCodeAt(i), 2654435761);
            h = Math.imul(h ^ (h >>> 16), 2246822507) ^ Math.imul(h >>> 13, 3266489909);
            let result = ((h ^= h >>> 16) >>> 0) / 4294967296;
            return result;
        }

        // Load Pre-Baked Data on startup
        async function fetchInitialData() {
            document.getElementById('loading').style.display = 'flex';
            try {
                // Fetching D1 data that was created by prep_data.py
                const response = await fetch('./data/Ready_Parcels_D1.geojson');
                if (!response.ok) throw new Error("Data file not found. Did you run prep_data.py?");
                allParcelsData = await response.json();
                document.getElementById('loading').style.display = 'none';
                console.log("Data loaded successfully:", allParcelsData.features.length, "parcels.");
            } catch (error) {
                console.error(error);
                document.getElementById('loading-text').innerText = "Error: " + error.message;
                document.getElementById('loading-text').classList.add('text-red-600');
            }
        }

        function runSimulation() {
            if (!allParcelsData) {
                alert("Data hasn't loaded yet! Please wait a second.");
                return;
            }

            // 1. Gather Levers
            const absorption = parseFloat(document.getElementById('absorption').value);
            const redevMode = document.getElementById('redev_mode').value;
            const excludeHistoric = document.getElementById('exclude_historic').checked;
            const restrictContext = document.getElementById('restrict_context').checked;
            const allowAdus = document.getElementById('allow_adus').checked;
            const allowMiddle = document.getElementById('allow_middle').checked;
            const middleTier = document.getElementById('middle_tier').value;
            const allowSplits = document.getElementById('allow_splits').checked;
            const allowConversions = document.getElementById('allow_conversions').checked;
            const allowMidrise = document.getElementById('allow_midrise').checked;
            const eliminateParking = document.getElementById('eliminate_parking').checked;
            const onlyVacant = document.getElementById('only_vacant').checked;

            let totalUnits = 0;
            let totalJobs = 0;
            let yieldFeatures = [];

            // 2. Loop through every pre-baked parcel (Super fast in JS)
            allParcelsData.features.forEach(feature => {
                const props = feature.properties;
                const seed = props.pidn || Math.random().toString(); 
                
                // Geographic Filters
                if (excludeHistoric && props.in_historic) return;
                if (restrictContext && !props.in_context) return;

                const z = (props.zonelabel || "").toLowerCase();
                const lu = (props.use_desc || "").toLowerCase();
                const sc = (props.state_cd_clean || "").toLowerCase();
                const lotArea = props.targetlotarea || 0;
                const coverage = props.coverage_pct || 0;
                const footprint = props.footprint_sqft || 0;
                const interior = props.interior_sqft || 0;

                // Vacant / Underutilized Logic
                const isVacant = ['a7', 'a8', 'c1', 'c10', 'c3', 'c6', 'c7', 'c8'].some(x => sc.includes(x)) || lu.includes('vacant');
                const isUnderutilized = coverage < 0.15;
                if (onlyVacant && !(isVacant || isUnderutilized)) return;

                const existingUnits = props.existing_units || 0;

                let isResidential = ['r', 'a', 'res', 'sf', 'th'].some(k => z.includes(k)) || ['residential', 'single-family', 'duplex', 'multi'].some(k => lu.includes(k));
                let isCommercial = ['c', 'mu', 'b', 'comm', 'm1', 'm2'].some(k => z.includes(k)) || ['commercial', 'office', 'retail', 'mixed'].some(k => lu.includes(k));
                if (!isResidential && !isCommercial) isResidential = true; // Fallback

                const parkingEfficiency = eliminateParking ? 1.0 : 0.65;
                const openLotSpace = Math.max(0, lotArea - footprint) * parkingEfficiency;

                let grossUnits = 0;
                let grossJobs = 0;

                // Core Logic
                if (isResidential) {
                    let policyApplied = false;
                    
                    if (allowConversions && interior >= 2000) {
                        grossUnits = Math.max(existingUnits, Math.floor((interior * 0.85) / CONVERSION_UNIT_SIZE));
                        policyApplied = true;
                    } else if (allowSplits && lotArea >= 4000) {
                        grossUnits = Math.floor(lotArea / 2000) * 2;
                        policyApplied = true;
                    } else if (allowMiddle) {
                        if (middleTier === '16-plex' && lotArea >= 6000) grossUnits = 16;
                        else if (middleTier === '8-plex' && lotArea >= 5000) grossUnits = 8;
                        else grossUnits = 4;
                        policyApplied = true;
                    }

                    if (!policyApplied) grossUnits = existingUnits;

                    if (allowAdus && grossUnits <= 1 && openLotSpace >= 800) {
                        grossUnits += 1;
                    }
                } else if (isCommercial) {
                    const heightBoost = allowMidrise && props.in_corridor;
                    const numFloors = heightBoost ? 4 : 1;
                    const buildableFootprint = lotArea * (heightBoost ? 0.50 : 0.40) * parkingEfficiency;

                    if (redevMode === 'Vertical Mixed-Use' && heightBoost) {
                        grossJobs = Math.floor(buildableFootprint / SQ_FT_PER_EMPLOYEE);
                        grossUnits = Math.floor((buildableFootprint * (numFloors - 1)) / AVG_UNIT_SIZE);
                    } else if (redevMode === 'Pure Residential Infill') {
                        grossUnits = Math.floor((buildableFootprint * numFloors) / AVG_UNIT_SIZE);
                    } else {
                        grossJobs = Math.floor((buildableFootprint * numFloors) / SQ_FT_PER_EMPLOYEE);
                    }
                }

                const netNewUnits = Math.max(0, grossUnits - existingUnits);

                // Probability Absorption
                if (netNewUnits > 0 || grossJobs > 0) {
                    const scaledUnits = netNewUnits * absorption;
                    const scaledJobs = grossJobs * absorption;
                    
                    // Fractional remainder probability (e.g. 1.2 jobs = 1 job + 20% chance of a 2nd)
                    const finalU = Math.floor(scaledUnits) + (seededRandom(seed + "U") < (scaledUnits % 1) ? 1 : 0);
                    const finalJ = Math.floor(scaledJobs) + (seededRandom(seed + "J") < (scaledJobs % 1) ? 1 : 0);

                    if (finalU > 0 || finalJ > 0) {
                        totalUnits += finalU;
                        totalJobs += finalJ;
                        
                        // Clone feature for the map to avoid mutating original
                        let yieldFeature = JSON.parse(JSON.stringify(feature));
                        yieldFeature.properties.sim_units = finalU;
                        yieldFeature.properties.sim_jobs = finalJ;
                        yieldFeatures.push(yieldFeature);
                    }
                }
            });

            // Update UI
            document.getElementById('stat-units').innerText = totalUnits.toLocaleString();
            document.getElementById('stat-jobs').innerText = totalJobs.toLocaleString();

            renderMap(yieldFeatures);
        }

        function renderMap(features) {
            if (geojsonLayer) map.removeLayer(geojsonLayer);

            if (features.length === 0) return;

            geojsonLayer = L.geoJSON(features, {
                style: function (feature) {
                    const u = feature.properties.sim_units > 0;
                    const j = feature.properties.sim_jobs > 0;
                    // Blue for Housing, Green for Jobs, Purple for Mixed
                    let color = '#3b82f6'; // blue
                    if (j && !u) color = '#10b981'; // green
                    if (u && j) color = '#8b5cf6'; // purple

                    return {
                        fillColor: color,
                        weight: 1,
                        opacity: 1,
                        color: 'white',
                        fillOpacity: 0.7
                    };
                },
                onEachFeature: function (feature, layer) {
                    let props = feature.properties;
                    let popupContent = `
                        <div class="text-sm">
                            <strong class="block text-gray-800 border-b pb-1 mb-1">Parcel: ${props.pidn}</strong>
                            <p class="text-blue-600 font-bold">New Units: +${props.sim_units || 0}</p>
                            <p class="text-green-600 font-bold">New Jobs: +${props.sim_jobs || 0}</p>
                            <p class="text-xs text-gray-500 mt-2">Zoning: ${props.zonelabel || 'N/A'}</p>
                        </div>
                    `;
                    layer.bindPopup(popupContent);
                }
            }).addTo(map);

            map.fitBounds(geojsonLayer.getBounds());
        }

        // Initialize Data on Load
        window.onload = fetchInitialData;
    </script>
</body>
</html>
