<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>El Paso Housing Strategy Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="p-6 max-w-7xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-white">El Paso Housing Strategy Simulator</h1>
            <p class="text-slate-400">Configure policies and visualize capacity impact.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-700">
                <h2 class="font-bold mb-4">Policy Levers</h2>
                <div class="space-y-4">
                    <label class="flex items-center gap-2"><input type="checkbox" id="eliminate_parking" class="accent-emerald-500"> Eliminate Parking Mandates</label>
                    <label class="flex items-center gap-2"><input type="checkbox" id="allow_lot_splits" class="accent-emerald-500"> Allow Lot Splits</label>
                    <label class="block text-sm">Middle Housing Tier:
                        <select id="middle_tier" class="w-full bg-slate-800 p-2 mt-1 rounded">
                            <option value="4">4-plex</option>
                            <option value="8">8-plex</option>
                            <option value="16">16-plex</option>
                        </select>
                    </label>
                    <button id="run-btn" class="w-full bg-emerald-600 p-3 rounded font-bold hover:bg-emerald-500 transition">Run Simulation</button>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div id="map-canvas" class="h-96 w-full rounded-xl border border-slate-700 mb-4"></div>
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-700">
                    <h2 class="font-bold mb-4">District Breakdown</h2>
                    <table class="w-full text-left" id="results-table">
                        <thead><tr><th>District</th><th>Units</th><th>Jobs</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pyodide = null;
        const map = L.map('map-canvas').setView([31.7619, -106.4850], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        async function init() {
            pyodide = await loadPyodide();
            await pyodide.loadPackage(["pandas", "micropip"]);
            const micropip = pyodide.pyimport("micropip");
            await micropip.install(["geopandas", "shapely", "pyproj"]);
            
            // Load Python script
            const resp = await fetch('./calculate_capacity.py');
            const code = await resp.text();
            pyodide.runPython(code);
            document.getElementById('run-btn').textContent = "Run Simulation";
        }

        document.getElementById('run-btn').onclick = async () => {
            const levers = {
                eliminate_parking: document.getElementById('eliminate_parking').checked,
                active_representative_districts: [1,2,3,4,5,6,7,8]
            };
            
            const results = pyodide.runPython(`run_simulation(${JSON.stringify(levers)})`);
            const data = JSON.parse(results);
            
            // Update Table
            const tbody = document.querySelector('#results-table tbody');
            tbody.innerHTML = '';
            for(let d in data.breakdowns) {
                tbody.innerHTML += `<tr><td>D${d}</td><td>${data.breakdowns[d].units}</td><td>${data.breakdowns[d].jobs}</td></tr>`;
            }
        };

        init();
    </script>
</body>
</html>
