<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>El Paso Housing Strategy Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 h-screen flex">

    <aside class="w-96 bg-white border-r p-6 overflow-y-auto">
        <h1 class="text-xl font-bold mb-4">Housing Simulator</h1>
        
        <div class="space-y-4 mb-6">
            <h3 class="font-bold">Geographic Filters</h3>
            <label class="block text-sm">Context Area:</label>
            <div class="flex gap-2">
                <label><input type="checkbox" id="ctx_urban" checked> Urban</label>
                <label><input type="checkbox" id="ctx_suburban" checked> Suburban</label>
            </div>
            <label class="flex items-center gap-2">
                <input type="checkbox" id="transit_only"> Restrict to Transit Corridors
            </label>
        </div>

        <div class="space-y-4">
            <h3 class="font-bold">Reforms</h3>
            <label class="flex items-center gap-2">
                <input type="checkbox" id="allow_conversions"> Allow Large Home Subdivisions
            </label>
            <label class="flex items-center gap-2">
                <input type="checkbox" id="allow_middle"> Allow Missing Middle
            </label>
            <button onclick="runSimulation()" class="w-full bg-blue-600 text-white p-2 rounded">Run Simulation</button>
        </div>
    </aside>

    <main class="flex-1 relative">
        <div id="map" class="h-full w-full"></div>
    </main>

    <script>
        const map = L.map('map').setView([31.76, -106.48], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        let allParcels = [];

        // Load all 8 districts
        async function loadAllDistricts() {
            for (let i = 1; i <= 8; i++) {
                try {
                    const res = await fetch(`./data/Ready_Parcels_D${i}.geojson`);
                    if (res.ok) {
                        const data = await res.json();
                        allParcels.push(...data.features);
                    }
                } catch (e) { console.warn(`District ${i} missing`); }
            }
            console.log("Total Parcels Loaded:", allParcels.length);
        }

        function runSimulation() {
            const ctxUrban = document.getElementById('ctx_urban').checked;
            const ctxSuburban = document.getElementById('ctx_suburban').checked;
            const transitOnly = document.getElementById('transit_only').checked;
            const allowConversions = document.getElementById('allow_conversions').checked;

            let filtered = allParcels.filter(p => {
                const props = p.properties;
                // Geographic Logic
                if (transitOnly && !props.in_corridor) return false;
                // Add Context Area logic here based on your data attributes
                return true; 
            });

            // Perform Math and Render
            console.log("Simulating", filtered.length, "parcels");
        }

        window.onload = loadAllDistricts;
    </script>
</body>
</html>
